name: CI

# Runs unchanged on github.com and on the internal GHES. The runner label comes
# from the RUNNER_LABEL repository variable (default ubuntu-latest).

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv 0.12.15
        run: |
          curl -LsSf https://astral.sh/uv/0.12.15/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen --only-group dev

      - name: Check black formatting
        run: uv run black --check src/

      - name: Check isort ordering
        run: uv run isort --check src/

      - name: Run flake8
        run: uv run flake8 src/

      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit --progress-spinner off

  lockfile-check:
    name: Lockfile in sync
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv 0.12.15
        run: |
          curl -LsSf https://astral.sh/uv/0.12.15/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

  build-test:
    name: Build image and run tests
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [lint, lockfile-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and test in one job: artifact upload v4 is unavailable on GHES.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: props:ci-test
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            INSTALL_DEV=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: CI_IMAGE=props:ci-test docker compose -f docker-compose.ci.yml up --exit-code-from web

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
