name: CI

# Runs unchanged on github.com and on the internal GHES. The runner label comes
# from the RUNNER_LABEL repository variable (default ubuntu-latest).

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.15"

      - name: Install dependencies
        run: uv sync --frozen --only-group dev

      - name: Check black formatting
        run: uv run black --check src/

      - name: Check isort ordering
        run: uv run isort --check src/

      - name: Run flake8
        run: uv run flake8 src/

      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit --progress-spinner off

  lockfile-check:
    name: Lockfile in sync
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.15"

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

  build:
    name: Build Docker Image
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [lint, lockfile-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: props:ci-test
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            INSTALL_DEV=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as artifact
        run: docker save props:ci-test | gzip > /tmp/props-ci.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/props-ci.tar.gz
          retention-days: 1

  test:
    name: Test
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: gunzip -c /tmp/props-ci.tar.gz | docker load

      - name: Run tests
        run: CI_IMAGE=props:ci-test docker compose -f docker-compose.ci.yml up --exit-code-from web

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
