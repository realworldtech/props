name: CI

# Build once, promote later. Every pull request builds the image for its head
# commit, runs the test suite against it, and publishes it as
# <registry>/realworldtech/props:sha-<commit>. Merges to develop and main only
# retag that image (see promote-develop.yml and release.yml).
#
# Runs unchanged on github.com and on the internal GHES. The runner label comes
# from the RUNNER_LABEL repository variable (default ubuntu-latest) and the
# registry follows the host.

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || 'containers.github.realworld.net.au' }}
  IMAGE: realworldtech/props

jobs:
  lint:
    name: Lint & Format
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv 0.12.15
        run: |
          curl -LsSf -o "$RUNNER_TEMP/uv-install.sh" https://astral.sh/uv/0.12.15/install.sh
          echo "716a1d6844740756c68770fcec2f79c2013fb9b03869a113f61e15f6f482a6a1  $RUNNER_TEMP/uv-install.sh" | sha256sum -c -
          UV_INSTALL_DIR="$RUNNER_TEMP/uv" sh "$RUNNER_TEMP/uv-install.sh" --no-modify-path
          echo "$RUNNER_TEMP/uv" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen --only-group dev

      - name: Check black formatting
        run: uv run black --check src/

      - name: Check isort ordering
        run: uv run isort --check src/

      - name: Run flake8
        run: uv run flake8 src/

      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit --progress-spinner off

  lockfile-check:
    name: Lockfile in sync
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv 0.12.15
        run: |
          curl -LsSf -o "$RUNNER_TEMP/uv-install.sh" https://astral.sh/uv/0.12.15/install.sh
          echo "716a1d6844740756c68770fcec2f79c2013fb9b03869a113f61e15f6f482a6a1  $RUNNER_TEMP/uv-install.sh" | sha256sum -c -
          UV_INSTALL_DIR="$RUNNER_TEMP/uv" sh "$RUNNER_TEMP/uv-install.sh" --no-modify-path
          echo "$RUNNER_TEMP/uv" >> "$GITHUB_PATH"

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

  build-test:
    name: Build & Test
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [lint, lockfile-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          load: true
          tags: props:ci-test
          build-args: GIT_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: CI_IMAGE=props:ci-test docker compose -f docker-compose.ci.yml up --exit-code-from web

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

      # Forks cannot push to the registry; their PRs are tested only.
      - name: Log in to the container registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish runtime image for this commit
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.event.pull_request.head.sha || github.sha }}
          build-args: GIT_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
