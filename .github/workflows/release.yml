name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

# Same file runs on github.com and on GHES; the registry follows the host and
# the runner label comes from the RUNNER_LABEL repository variable.
env:
  REGISTRY: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || 'containers.github.realworld.net.au' }}

jobs:
  version:
    name: Calculate & Tag Version
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next CalVer version
        id: calc
        run: |
          YEAR_MONTH=$(date -u +%Y.%m)
          # Find highest patch number for this month from existing tags
          LATEST_PATCH=$(git tag -l "v${YEAR_MONTH}.*" | sed "s/v${YEAR_MONTH}\.//" | sort -n | tail -1)
          if [ -z "$LATEST_PATCH" ]; then
            PATCH=0
          else
            PATCH=$((LATEST_PATCH + 1))
          fi
          VERSION="${YEAR_MONTH}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Version: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create annotated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.calc.outputs.tag }}" -m "Release ${{ steps.calc.outputs.version }}"
          git push origin "${{ steps.calc.outputs.tag }}"

  build-test-publish:
    name: Build, test and publish image
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # One job end to end: artifact upload v4 is unavailable on GHES. The
      # image is built with INSTALL_DEV so tests can run, then rebuilt
      # without dev tooling for publication (a cache hit for every layer
      # except the dependency sync).
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: props:ci-test
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            INSTALL_DEV=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: CI_IMAGE=props:ci-test docker compose -f docker-compose.ci.yml up --exit-code-from web

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        uses: docker/build-push-action@v6
        env:
          VERSION: ${{ needs.version.outputs.version }}
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/realworldtech/props:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/realworldtech/props:latest
            ${{ env.REGISTRY }}/realworldtech/props:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
