name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

# Same file runs on github.com and on GHES; the registry follows the host and
# the runner label comes from the RUNNER_LABEL repository variable.
env:
  IMAGE: realworldtech/props
  REGISTRY: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || 'containers.github.realworld.net.au' }}

jobs:
  version:
    name: Calculate & Tag Version
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next CalVer version
        id: calc
        run: |
          YEAR_MONTH=$(date -u +%Y.%m)
          # Find highest patch number for this month from existing tags
          LATEST_PATCH=$(git tag -l "v${YEAR_MONTH}.*" | sed "s/v${YEAR_MONTH}\.//" | sort -n | tail -1)
          if [ -z "$LATEST_PATCH" ]; then
            PATCH=0
          else
            PATCH=$((LATEST_PATCH + 1))
          fi
          VERSION="${YEAR_MONTH}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Version: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create annotated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.calc.outputs.tag }}" -m "Release ${{ steps.calc.outputs.version }}"
          git push origin "${{ steps.calc.outputs.tag }}"

  publish:
    name: Promote commit image to release
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: version
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the image built for this merge
        id: src
        run: |
          # The merge commit itself was never built; the PR head (second parent)
          # was. Fall back to building when no image exists for it.
          set -euo pipefail
          IMG="$REGISTRY/$IMAGE"
          if git rev-parse -q --verify HEAD^2 >/dev/null; then SRC=$(git rev-parse HEAD^2); else SRC=$(git rev-parse HEAD); fi
          echo "source commit: $SRC"
          if docker buildx imagetools inspect "$IMG:sha-$SRC" >/dev/null 2>&1; then
            echo "promote=$IMG:sha-$SRC" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no image for $SRC; building from this commit"
            echo "promote=" >> "$GITHUB_OUTPUT"
          fi

      # The image carries only its commit; the release version is passed to
      # the app at runtime as APP_VERSION (PROPS_VERSION in .env).
      - name: Retag as release
        if: steps.src.outputs.promote != ''
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          IMG="$REGISTRY/$IMAGE"
          YEAR_MONTH=$(echo "$VERSION" | cut -d. -f1,2)
          docker buildx imagetools create \
            -t "$IMG:$VERSION" -t "$IMG:$YEAR_MONTH" -t "$IMG:latest" -t "$IMG:sha-${{ github.sha }}" \
            "${{ steps.src.outputs.promote }}"

      - name: Build (fallback, direct push without a tested image)
        if: steps.src.outputs.promote == ''
        uses: docker/build-push-action@v6
        env:
          VERSION: ${{ needs.version.outputs.version }}
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "### Release $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$REGISTRY/$IMAGE:$VERSION\` (also :latest). Deploy with PROPS_VERSION=$VERSION." >> "$GITHUB_STEP_SUMMARY"
