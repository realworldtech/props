name: Develop Image

on:
  push:
    branches: [develop]

concurrency:
  group: develop-image-${{ github.sha }}
  cancel-in-progress: true

permissions:
  packages: write

# Same file runs on github.com and on GHES; the registry follows the host and
# the runner label comes from the RUNNER_LABEL repository variable.
env:
  REGISTRY: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || 'containers.github.realworld.net.au' }}

jobs:
  build-and-push:
    name: Build & Push Dev Image
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/realworldtech/props:develop
            ${{ env.REGISTRY }}/realworldtech/props:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=develop-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
