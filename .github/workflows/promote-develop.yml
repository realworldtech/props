name: Promote to develop

# Retags the image built for the merged pull request as :develop. Nothing is
# rebuilt. Same file for github.com and GHES (see ci.yml).

on:
  push:
    branches: [develop]

concurrency:
  group: promote-develop
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || 'containers.github.realworld.net.au' }}
  IMAGE: realworldtech/props

jobs:
  promote:
    name: Retag commit image as develop
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the image built for this merge
        id: src
        run: |
          # The merge commit itself was never built; the PR head (second parent)
          # was. Fall back to building when no image exists for it.
          set -euo pipefail
          IMG="$REGISTRY/$IMAGE"
          if git rev-parse -q --verify HEAD^2 >/dev/null; then SRC=$(git rev-parse HEAD^2); else SRC=$(git rev-parse HEAD); fi
          echo "source commit: $SRC"
          if docker buildx imagetools inspect "$IMG:sha-$SRC" >/dev/null 2>&1; then
            echo "promote=$IMG:sha-$SRC" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no image for $SRC; building from this commit"
            echo "promote=" >> "$GITHUB_OUTPUT"
          fi

      - name: Retag as develop
        if: steps.src.outputs.promote != ''
        run: docker buildx imagetools create -t "$REGISTRY/$IMAGE:develop" -t "$REGISTRY/$IMAGE:sha-${{ github.sha }}" "${{ steps.src.outputs.promote }}"

      - name: Build (fallback, direct push without a tested image)
        if: steps.src.outputs.promote == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:develop
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
